product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - io.ktor:ktor-client-core:3.1.1
  - io.ktor:ktor-client-content-negotiation:3.1.1
  - io.ktor:ktor-client-logging:3.1.1
  - io.ktor:ktor-serialization-kotlinx-json:3.1.1
  - com.russhwolf:multiplatform-settings:1.3.0
  - com.russhwolf:multiplatform-settings-no-arg:1.3.0
  - io.coil-kt.coil3:coil-compose:3.0.4
  - io.coil-kt.coil3:coil-network-ktor3:3.0.4

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose
  - io.ktor:ktor-client-okhttp:3.1.1

dependencies@ios:
  - io.ktor:ktor-client-darwin:3.1.1

settings:
  kotlin:
    serialization: json
  compose:
    enabled: true
    resources:
      packageName: ir.farimod.app.resources
      exposedAccessors: true
